<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      try {
        if (localStorage.getItem("internet-nations-hide-chrome") === "1") {
          document.documentElement.classList.add("chrome-hidden");
        }
      } catch (_) {}
    </script>
    <title>互聯網民族</title>
    <meta
      name="description"
      content="A bilingual atlas of internet-nation platform tribes: social, messaging, payments, search, and AI."
    />
    <meta name="theme-color" content="#f3eee4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;0,9..144,620;1,9..144,520&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%239c3b2a'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip" id="skip" href="#q"></a>
    <div id="app">
      <header class="mast">
        <div class="brand">
          <span class="chop" aria-hidden="true"></span>
          <div class="brand-text">
            <p id="kicker" class="kicker"></p>
            <h1 id="brand-title"></h1>
          </div>
          <p id="brand-en" class="brand-en"></p>
        </div>
        <div class="tools">
          <span id="year-badge" class="year-badge"></span>
          <div id="lang" class="lang" role="group"></div>
          <button id="index-btn" class="text-btn" type="button"></button>
          <button id="about-btn" class="text-btn" type="button"></button>
        </div>
        <div class="control-row">
          <div id="layers" class="layers" role="group"></div>
          <div class="search" id="search">
            <label class="sr" id="search-label" for="q"></label>
            <input
              id="q"
              type="search"
              autocomplete="off"
              spellcheck="false"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="results"
            />
            <ul id="results" role="listbox" hidden></ul>
          </div>
          <div class="region-wrap" id="region-wrap">
            <button id="region-btn" class="text-btn" type="button" aria-haspopup="true" aria-expanded="false"></button>
            <div id="region-pop" class="pop" hidden></div>
          </div>
        </div>
        <nav id="crumbs" class="crumbs"></nav>
        <button id="hide-chrome" class="chrome-hide" type="button"></button>
      </header>
      <div id="chrome-restore" class="chrome-restore">
        <button id="show-chrome" class="chrome-show" type="button"></button>
        <button id="about-restore" class="chrome-method" type="button"></button>
      </div>
      <div class="stage">
        <div id="map"></div>
        <div id="legend" class="legend"></div>
        <p id="geo-fail" class="geo-fail" hidden></p>
        <aside id="panel" class="panel" hidden tabindex="-1" aria-labelledby="panel-title"></aside>
      </div>
    </div>
    <div id="tip" class="tip" hidden></div>
    <div id="about" class="overlay" hidden></div>
    <div id="index" class="overlay" hidden></div>
    <div id="live" class="sr" aria-live="polite"></div>
    <noscript>
      <p>互聯網民族需要 JavaScript 繪製地圖。國家資料在 data/countries.json。</p>
      <p>Internet Nations needs JavaScript to draw the map. Country data is in data/countries.json.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
